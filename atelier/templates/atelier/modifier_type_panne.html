{% extends 'atelier/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-header bg-secondary text-white text-center">
                <h4 class="mb-0">✏️ Modifier la Catégorie</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom de la catégorie</label>
                        {{ form.libelle }}
                        {% if form.libelle.errors %}
                            <div class="text-danger small">{{ form.libelle.errors }}</div>
                        {% endif %}
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                        <a href="{% url 'liste_types_panne' %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Style pour assurer la cohérence visuelle avec Bootstrap */
    input {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
    }
</style>
{% endblock %}
