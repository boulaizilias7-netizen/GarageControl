{% extends 'atelier/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body text-center">
                <h3>⚠️ Confirmation</h3>
                <p>Êtes-vous sûr de vouloir supprimer le véhicule <strong>{{ objet.immatriculation }}</strong> ?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Oui, supprimer définitivement</button>
                    <a href="{% url 'liste_vehicules' %}" class="btn btn-secondary">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
