{% extends 'atelier/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>⚙️ Configuration des Types de Pannes</h2>
    <a href="{% url 'ajouter_type_panne' %}" class="btn btn-success">
        <i class="fas fa-plus"></i> Ajouter une catégorie
    </a>
</div>

<div class="card shadow border-0">
    <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 60%">Libellé</th>
                    <th style="width: 30%" class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for type in types %}
                <tr>
                    <td><span class="badge bg-light text-dark border">#{{ type.id }}</span></td>
                    <td class="fw-bold">{{ type.libelle }}</td>
                    <td class="text-center">
                        <div class="btn-group" role="group">
                            <a href="{% url 'modifier_type_panne' type.id %}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Modifier
                            </a>
                            <a href="{% url 'supprimer_type_panne' type.id %}" class="btn btn-sm btn-outline-danger">
                                <i class="fas fa-trash"></i> Supprimer
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">
                        Aucun type de panne configuré.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
